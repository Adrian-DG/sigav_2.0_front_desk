<aside
  class="fixed inset-y-0 left-0 z-30 flex w-[72px] flex-col bg-gradient-to-b from-primary-900 to-primary-800 text-white shadow-xl lg:w-64"
>
  <!-- Marca -->
  <div class="flex h-20 items-center gap-3 border-b border-white/10 px-3.5 lg:px-5">
    <img
      src="/brand/comipol-crest.png"
      alt="Escudo COMIPOL"
      class="h-11 w-11 shrink-0 object-contain"
    />
    <div class="hidden min-w-0 lg:block">
      <p class="text-lg leading-tight font-extrabold tracking-tight">SiGAV</p>
      <p class="truncate text-xs font-medium text-primary-200">Front Desk</p>
    </div>
  </div>

  <!-- Opciones según permisos -->
  <nav class="flex-1 overflow-y-auto px-3 py-5" aria-label="Navegación principal">
    <p
      class="mb-2 hidden px-3 text-[11px] font-bold tracking-wider text-primary-300 uppercase lg:block"
    >
      Menú
    </p>
    <ul class="flex flex-col gap-1">
      @for (item of items(); track item.path) {
        <li>
          <a
            [routerLink]="item.path"
            routerLinkActive="bg-white/10 text-white before:opacity-100"
            [routerLinkActiveOptions]="{ exact: item.path === '/' }"
            [title]="item.label"
            [attr.aria-label]="item.label"
            class="relative flex h-11 items-center justify-center gap-3 rounded-xl px-3 text-sm font-semibold text-primary-100 transition-colors before:absolute before:inset-y-2 before:left-0 before:w-1 before:rounded-r-full before:bg-accent-500 before:opacity-0 before:transition-opacity hover:bg-white/5 hover:text-white lg:justify-start"
          >
            <app-icon [name]="item.icon" class="h-5 w-5" />
            <span class="hidden lg:inline">{{ item.label }}</span>
          </a>
        </li>
      }
    </ul>
  </nav>

  <!-- Usuario -->
  <div class="border-t border-white/10 p-3">
    <div
      class="flex items-center justify-center gap-3 rounded-xl px-1 py-2 lg:justify-start lg:px-2"
    >
      <div
        class="hidden h-9 w-9 shrink-0 items-center justify-center rounded-full bg-accent-500 text-sm font-bold text-white lg:flex"
        aria-hidden="true"
      >
        {{ iniciales() }}
      </div>
      <div class="hidden min-w-0 flex-1 lg:block">
        <p class="truncate text-sm font-semibold">{{ auth.sesion()?.nombre ?? 'Usuario' }}</p>
        <p class="text-xs text-primary-300">Sesión web</p>
      </div>
      <button
        type="button"
        title="Cerrar sesión"
        aria-label="Cerrar sesión"
        class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg text-primary-200 transition-colors hover:bg-white/10 hover:text-white"
        (click)="auth.logout()"
      >
        <app-icon name="salir" class="h-5 w-5" />
      </button>
    </div>
  </div>
</aside>
