<div class="flex min-h-screen bg-neutral-50">
  <!-- Panel institucional: solo en pantallas md+, el formulario ocupa todo el ancho en móvil -->
  <div class="relative hidden w-1/2 flex-col items-center justify-center overflow-hidden bg-gradient-to-br from-primary-700 via-primary-800 to-secondary-800 p-12 text-white md:flex">
    <div class="absolute -right-24 -top-24 h-72 w-72 rounded-full bg-white/5"></div>
    <div class="absolute -bottom-32 -left-16 h-80 w-80 rounded-full bg-accent-500/10"></div>

    <img src="/brand/comipol-crest.png" alt="Escudo COMIPOL" class="relative z-10 h-36 w-36 object-contain drop-shadow-lg" />
    <h1 class="relative z-10 mt-6 text-3xl font-extrabold tracking-tight">SiGAV</h1>
    <p class="relative z-10 mt-2 max-w-xs text-center text-sm font-medium text-primary-100">
      Sistema de Gestión de Asistencia Vial · Comisión Militar y Policial
    </p>
  </div>

  <!-- Formulario -->
  <div class="flex w-full flex-1 flex-col items-center justify-center px-6 py-12 md:w-1/2">
    <div class="w-full max-w-sm">
      <img src="/brand/comipol-crest.png" alt="Escudo COMIPOL" class="mx-auto mb-6 h-20 w-20 object-contain md:hidden" />

      <h2 class="text-2xl font-extrabold text-neutral-900">Bienvenido</h2>
      <p class="mt-1 text-sm font-medium text-neutral-500">Ingresa tus credenciales para continuar</p>

      <form class="mt-8 flex flex-col gap-5" (ngSubmit)="submit()">
        <app-text-field
          label="Usuario"
          placeholder="Ingresa tu usuario"
          autocomplete="username"
          [disabled]="isSubmitting()"
          [value]="username()"
          (valueChange)="username.set($event)">
          <svg leading class="h-5 w-5 shrink-0 text-neutral-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0ZM12 14a7 7 0 0 0-7 7h14a7 7 0 0 0-7-7Z" />
          </svg>
        </app-text-field>

        <app-text-field
          label="Contraseña"
          placeholder="Ingresa tu contraseña"
          autocomplete="current-password"
          [type]="hidePassword() ? 'password' : 'text'"
          [disabled]="isSubmitting()"
          [value]="password()"
          (valueChange)="password.set($event)">
          <svg leading class="h-5 w-5 shrink-0 text-neutral-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2Zm10-10V7a4 4 0 1 0-8 0v4h8Z" />
          </svg>
          <button
            trailing
            type="button"
            class="shrink-0 text-neutral-400 hover:text-neutral-600"
            [attr.aria-label]="hidePassword() ? 'Mostrar contraseña' : 'Ocultar contraseña'"
            (click)="hidePassword.set(!hidePassword())">
            @if (hidePassword()) {
              <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 3l18 18M10.6 10.7a2.5 2.5 0 0 0 3.5 3.5M9.3 5.5A10.4 10.4 0 0 1 12 5c5 0 9 4 10.5 7-0.6 1.2-1.5 2.5-2.7 3.6M6.2 6.6C4.3 7.9 2.9 9.6 1.5 12c1.5 3 5.5 7 10.5 7 1.3 0 2.5-0.2 3.6-0.7" />
              </svg>
            } @else {
              <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12Z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            }
          </button>
        </app-text-field>

        @if (formError()) {
          <p class="rounded-xl bg-danger-50 px-4 py-3 text-sm font-semibold text-danger-700" role="alert">{{ formError() }}</p>
        }

        <app-button type="submit" [disabled]="!canSubmit()" [loading]="isSubmitting()">Ingresar</app-button>
      </form>
    </div>
  </div>
</div>
